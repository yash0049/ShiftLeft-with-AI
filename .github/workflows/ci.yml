name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the python:3.12-slim base image in backend/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 22 matches the node:22-alpine build stage in frontend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci rather than install: fails if package.json and the lockfile disagree,
      # which is also what would break the image build.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run vitest
        run: npm test

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Catches schema and reference errors in docker-compose.yml itself, which
      # building the two Dockerfiles directly would not.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: securetrack-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: securetrack-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish results to the repository's Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Semgrep's own CLI, pinned. The standalone semgrep-action is deprecated;
      # Semgrep's current CI guidance is to run the CLI directly.
      - name: Install Semgrep
        run: pip install semgrep==1.177.0

      # Scans at every severity and always exits 0 -- `--error` is deliberately
      # not passed, so the SARIF upload steps below still run when there are
      # findings. The gate at the end of the job decides what blocks the build.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif \
            --metrics=off \
            backend/ frontend/

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      # Fork PRs and private repos without Advanced Security cannot write code
      # scanning results, so a failure here must not mask the scan itself.
      - name: Upload SARIF to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Semgrep records severity on the rule, not on each SARIF result, so this
      # joins the two. See .github/scripts/semgrep-gate.py.
      - name: Fail on high-severity findings
        run: python .github/scripts/semgrep-gate.py semgrep.sarif
