server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # API traffic passes straight through to Flask. The browser only ever talks
    # to this origin, so CORS stays out of the picture -- same arrangement the
    # Vite dev server provides in local development.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass         http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames here, so they can be cached hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
